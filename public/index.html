<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusChat - الدردشة الآمنة</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-sidebar: #1e293b;
      --bg-card: #334155;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

    .app-container { display: flex; width: 100%; height: 100%; }
    
    /* القائمة الجانبية */
    .sidebar { width: 320px; background: var(--bg-sidebar); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; }
    .sidebar-header { padding: 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 45px; height: 45px; border-radius: 50%; background: var(--accent); color: var(--bg-main); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; object-fit: cover; }
    
    /* شريط السناب الأفقي للأصدقاء */
    .stories-bar { display: flex; gap: 12px; padding: 12px 15px; overflow-x: auto; border-bottom: 1px solid var(--border-color); background: var(--bg-main); white-space: nowrap; }
    .stories-bar::-webkit-scrollbar { display: none; }
    .story-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; min-width: 55px; }
    .story-avatar-wrap { width: 52px; height: 52px; border-radius: 50%; padding: 2px; background: linear-gradient(45deg, #38bdf8, #818cf8); display: flex; align-items: center; justify-content: center; }
    .story-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: var(--bg-card); color: var(--text-main); display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid var(--bg-main); }
    .story-name { font-size: 0.7rem; margin-top: 4px; color: var(--text-muted); max-width: 55px; overflow: hidden; text-overflow: ellipsis; text-align: center; }

    /* قائمة الأصدقاء والطلبات */
    .contact-list { flex: 1; overflow-y: auto; padding: 10px; }
    .contact-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-radius: 8px; margin-bottom: 6px; cursor: pointer; transition: background 0.2s; background: var(--bg-card); }
    .contact-item:hover { background: #475569; }

    /* منطقة الدردشة الرئيسية */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); }
    .chat-header { padding: 15px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
    .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 60%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; }
    .message.sent { background: #0284c7; align-self: flex-start; }
    .message.received { background: var(--bg-card); align-self: flex-end; }
    .chat-input-area { padding: 15px; background: var(--bg-sidebar); display: flex; gap: 10px; align-items: center; }
    .chat-input-area input { flex: 1; padding: 10px 15px; border-radius: 8px; border: none; background: var(--bg-main); color: var(--text-main); outline: none; }
    .chat-input-area button { padding: 10px 20px; border-radius: 8px; border: none; background: var(--accent); color: var(--bg-main); font-weight: bold; cursor: pointer; }

    /* النوافذ المنبثقة (Modals) */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: var(--bg-sidebar); padding: 25px; border-radius: 12px; width: 400px; max-width: 90vw; display: flex; flex-direction: column; gap: 15px; max-height: 85vh; overflow-y: auto; }
    .modal-content input { padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main); outline: none; }
    .preview-banner { height: 90px; background-size: cover; background-position: center; border-radius: 8px; background-color: var(--bg-card); position: relative; }
    .preview-avatar { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; position: absolute; bottom: -20px; right: 15px; border: 3px solid var(--bg-sidebar); background: var(--accent); }

    @media (max-width: 768px) {
      .app-container { flex-direction: column; }
      .sidebar { width: 100%; height: 45vh; border-left: none; border-bottom: 1px solid var(--border-color); }
      .chat-area { height: 55vh; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- القائمة الجانبية -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="user-info">
          <img class="avatar" id="my-avatar" src="" alt="U">
          <div>
            <div style="font-weight: bold;" id="my-username">مستخدم</div>
            <div style="font-size: 0.75rem; color: #22c55e;">متصل</div>
          </div>
        </div>
        <div style="display: flex; gap: 5px;">
          <button onclick="openProfileModal()" style="background: #334155; color: #38bdf8; border: none; padding: 4px 8px; border-radius: 8px; cursor: pointer; font-size: 0.7rem;">تعديل</button>
          <button onclick="logoutUser()" style="background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 8px; cursor: pointer; font-size: 0.7rem;">خروج</button>
        </div>
      </div>

      <!-- شريط السناب الأفقي للأصدقاء -->
      <div class="stories-bar" id="stories-bar">
        <div class="story-item" onclick="openSearchModal()">
          <div class="story-avatar-wrap" style="background: var(--border-color);">
            <div class="story-avatar" style="background: var(--accent); color: var(--bg-main); font-size: 1.4rem;">+</div>
          </div>
          <span class="story-name">إضافة</span>
        </div>
      </div>

      <div class="contact-list" id="contact-list">
        <!-- الأصدقاء والطلبات -->
      </div>
    </div>

    <!-- منطقة الدردشة -->
    <div class="chat-area">
      <div class="chat-header">
        <span id="current-chat-title">اختر صديقاً لبدء المحادثة</span>
      </div>
      <div class="messages-container" id="messages-container"></div>
      <div class="chat-input-area">
        <input type="text" id="message-input" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">إرسال</button>
      </div>
    </div>
  </div>

  <!-- نافذة تعديل الملف الشخصي (صورة، بنر، اسم) -->
  <div class="modal" id="profile-modal">
    <div class="modal-content">
      <h3>تعديل الملف الشخصي</h3>
      <div class="preview-banner" id="preview-banner">
        <img class="preview-avatar" id="preview-avatar" src="" alt="">
      </div>
      <div style="margin-top: 15px;">
        <label style="font-size: 0.8rem; color: var(--text-muted);">تغيير صورة البنر:</label>
        <input type="file" id="banner-input" accept="image/*" style="width:100%; margin-top:5px;">
      </div>
      <div>
        <label style="font-size: 0.8rem; color: var(--text-muted);">تغيير الصورة الشخصية:</label>
        <input type="file" id="avatar-input" accept="image/*" style="width:100%; margin-top:5px;">
      </div>
      <div>
        <label style="font-size: 0.8rem; color: var(--text-muted);">اسم المستخدم:</label>
        <input type="text" id="edit-username" placeholder="اسم المستخدم" style="width:100%; margin-top:5px;">
      </div>
      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button onclick="saveProfileChanges()" id="save-profile-btn" style="flex:1; background: var(--accent); color: var(--bg-main); border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer;">حفظ</button>
        <button onclick="closeProfileModal()" style="flex:1; background: transparent; color: var(--text-muted); border:1px solid var(--border-color); border-radius:6px; cursor:pointer;">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- نافذة مستقلة للبحث وإضافة الأصدقاء -->
  <div class="modal" id="search-modal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3>إضافة أصدقاء جدد</h3>
        <button onclick="closeSearchModal()" style="background:transparent; border:none; color:var(--text-main); font-size:1.2rem; cursor:pointer;">✕</button>
      </div>
      
      <!-- خانة البحث مع زر بحث واضح -->
      <div style="display: flex; gap: 8px; margin-top: 5px;">
        <input type="text" id="modal-search-input" placeholder="اكتب اسم المستخدم للبحث..." style="flex: 1;" onkeydown="if(event.key === 'Enter') triggerSearch()">
        <button onclick="triggerSearch()" style="background: var(--accent); color: var(--bg-main); border: none; padding: 0 16px; border-radius: 6px; font-weight: bold; cursor: pointer;">بحث</button>
      </div>

      <div id="search-results-container" style="max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-top: 5px;">
        <div style="color: var(--text-muted); text-align: center; padding: 20px;">جارٍ تحميل المستخدمين...</div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let userProfile = JSON.parse(localStorage.getItem('nexus_user'));
    if (!userProfile) window.location.href = '/login.html';

    // الانضمام لغرفة المستخدم الخاصة فوراً لاستقبال طلبات الإضافة بشكل لحظي
    socket.emit('join_room', userProfile.id || userProfile._id);

    function updateTopBar() {
      document.getElementById('my-username').textContent = userProfile.username;
      const defaultAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(userProfile.username)}&background=38bdf8&color=0f172a`;
      document.getElementById('my-avatar').src = userProfile.avatar || defaultAvatar;
    }
    updateTopBar();

    function logoutUser() {
      localStorage.removeItem('nexus_user');
      window.location.href = '/login.html';
    }

    // إدارة نافذة التعديل (الاسم + الصورة + البنر)
    function openProfileModal() {
      document.getElementById('edit-username').value = userProfile.username;
      const defaultAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(userProfile.username)}&background=38bdf8&color=0f172a`;
      document.getElementById('preview-avatar').src = userProfile.avatar || defaultAvatar;
      if (userProfile.banner) {
        document.getElementById('preview-banner').style.backgroundImage = `url(${userProfile.banner})`;
      } else {
        document.getElementById('preview-banner').style.backgroundImage = 'none';
      }
      document.getElementById('profile-modal').style.display = 'flex';
    }
    function closeProfileModal() { document.getElementById('profile-modal').style.display = 'none'; }

    let newAvatarBase64 = userProfile?.avatar || '';
    let newBannerBase64 = userProfile?.banner || '';

    document.getElementById('avatar-input').addEventListener('change', function(e) {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { newAvatarBase64 = reader.result; document.getElementById('preview-avatar').src = newAvatarBase64; };
      reader.readAsDataURL(file);
    });

    document.getElementById('banner-input').addEventListener('change', function(e) {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { newBannerBase64 = reader.result; document.getElementById('preview-banner').style.backgroundImage = `url(${newBannerBase64})`; };
      reader.readAsDataURL(file);
    });

    async function saveProfileChanges() {
      const btn = document.getElementById('save-profile-btn');
      btn.textContent = 'جاري الحفظ...';
      const updatedName = document.getElementById('edit-username').value.trim();
      try {
        const res = await fetch('/api/profile/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            userId: userProfile.id || userProfile._id, 
            username: updatedName, 
            avatar: newAvatarBase64, 
            banner: newBannerBase64 
          })
        });
        const data = await res.json();
        if (res.ok) {
          userProfile = data.user;
          localStorage.setItem('nexus_user', JSON.stringify(userProfile));
          updateTopBar();
          closeProfileModal();
          window.location.reload();
        } else { alert(data.message); }
      } catch (err) { alert('خطأ في الاتصال'); }
      finally { btn.textContent = 'حفظ'; }
    }

    // إدارة نافذة البحث والإضافة المستقلة
    function openSearchModal() {
      document.getElementById('modal-search-input').value = '';
      document.getElementById('search-modal').style.display = 'flex';
      triggerSearch(''); // يعرض كل المستخدمين المسجلين فور فتح النافذة
    }
    function closeSearchModal() { document.getElementById('search-modal').style.display = 'none'; }

    async function triggerSearch(searchQuery = null) {
      const query = searchQuery !== null ? searchQuery : document.getElementById('modal-search-input').value.trim();
      const container = document.getElementById('search-results-container');
      const userId = userProfile.id || userProfile._id;
      
      container.innerHTML = `<div style="color: var(--text-muted); text-align: center; padding: 15px;">جارٍ البحث...</div>`;

      try {
        const res = await fetch(`/api/users/search?query=${encodeURIComponent(query)}&currentUserId=${userId}`);
        const users = await res.json();

        container.innerHTML = '';
        if (users.length === 0) {
          container.innerHTML = `<div style="padding: 15px; color: var(--text-muted); text-align:center;">لا يوجد مستخدمون مطابقون</div>`;
          return;
        }

        users.forEach(u => {
          const defaultAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(u.username)}&background=38bdf8&color=0f172a`;
          
          const isFriend = u.friends && u.friends.some(id => id.toString() === userId);
          const hasSentRequest = u.friendRequests && u.friendRequests.some(id => id.toString() === userId);

          let actionButtonHTML = '';
          if (isFriend) {
            actionButtonHTML = `<span style="font-size: 0.8rem; color: #22c55e; font-weight: bold;">أصدقاء</span>`;
          } else if (hasSentRequest) {
            actionButtonHTML = `<button disabled style="background: #22c55e; color: white; border:none; padding:6px 12px; border-radius:6px; font-weight:bold; opacity: 0.8;">تم الإرسال</button>`;
          } else {
            actionButtonHTML = `<button onclick="sendFriendRequest('${u._id}', this)" style="background: var(--accent); color: var(--bg-main); border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-weight:bold;">إضافة</button>`;
          }

          container.innerHTML += `
            <div class="contact-item">
              <div style="display:flex; align-items:center; gap:10px;">
                <img src="${u.avatar || defaultAvatar}" style="width:35px; height:35px; border-radius:50%; object-fit:cover;">
                <span>${u.username}</span>
              </div>
              ${actionButtonHTML}
            </div>
          `;
        });
      } catch (err) {
        container.innerHTML = `<div style="padding: 15px; color: #ef4444; text-align:center;">حدث خطأ في الاتصال بالبحث</div>`;
      }
    }

    async function sendFriendRequest(toUserId, btn) {
      const fromUserId = userProfile.id || userProfile._id;
      const res = await fetch('/api/friends/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fromUserId, toUserId })
      });
      const data = await res.json();
      alert(data.message);
      if (res.ok) {
        btn.textContent = 'تم الإرسال';
        btn.style.background = '#22c55e';
        btn.disabled = true;
      }
    }

    // جلب الأصدقاء وطلبات الإضافة
    async function loadFriendsAndData() {
      const userId = userProfile.id || userProfile._id;
      const res = await fetch(`/api/friends/${userId}`);
      const data = await res.json();
      
      const storiesBar = document.getElementById('stories-bar');
      const contactList = document.getElementById('contact-list');
      
      // زر الإضافة الدائري الثابت في البداية
      storiesBar.innerHTML = `
        <div class="story-item" onclick="openSearchModal()">
          <div class="story-avatar-wrap" style="background: var(--border-color);">
            <div class="story-avatar" style="background: var(--accent); color: var(--bg-main); font-size: 1.4rem;">+</div>
          </div>
          <span class="story-name">إضافة</span>
        </div>
      `;
      contactList.innerHTML = '';

      // عرض طلبات الصداقة الواردة
      if (data.requests && data.requests.length > 0) {
        contactList.innerHTML += `<div style="font-size: 0.8rem; color: var(--accent); padding: 5px; font-weight:bold;">طلبات الصداقة الواردة:</div>`;
        data.requests.forEach(req => {
          const defaultAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(req.username)}&background=38bdf8&color=0f172a`;
          contactList.innerHTML += `
            <div class="contact-item">
              <div style="display:flex; align-items:center; gap:8px;">
                <img src="${req.avatar || defaultAvatar}" style="width:30px; height:30px; border-radius:50%; object-fit:cover;">
                <span>${req.username}</span>
              </div>
              <div style="display:flex; gap:4px;">
                <button onclick="respondRequest('${req._id}', 'accept')" style="background:#22c55e; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">قبول</button>
                <button onclick="respondRequest('${req._id}', 'reject')" style="background:#ef4444; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">رفض</button>
              </div>
            </div>
          `;
        });
      }

      // عرض الأصدقاء المقبولين
      if (data.friends && data.friends.length > 0) {
        contactList.innerHTML += `<div style="font-size: 0.8rem; color: var(--text-muted); padding: 5px; margin-top:10px; font-weight:bold;">الأصدقاء:</div>`;
        data.friends.forEach(friend => {
          const defaultAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(friend.username)}&background=38bdf8&color=0f172a`;
          
          // إضافة في شريط السناب العلوي
          storiesBar.innerHTML += `
            <div class="story-item" onclick="startChat('${friend._id}', '${friend.username}')">
              <div class="story-avatar-wrap">
                <img class="story-avatar" src="${friend.avatar || defaultAvatar}" alt="">
              </div>
              <span class="story-name">${friend.username}</span>
            </div>
          `;

          // إضافة في القائمة الجانبية
          contactList.innerHTML += `
            <div class="contact-item" onclick="startChat('${friend._id}', '${friend.username}')">
              <div style="display:flex; align-items:center; gap:8px;">
                <img src="${friend.avatar || defaultAvatar}" style="width:35px; height:35px; border-radius:50%; object-fit:cover;">
                <span>${friend.username}</span>
              </div>
              <span style="font-size: 0.75rem; color: #22c55e;">محادثة</span>
            </div>
          `;
        });
      } else if (!data.requests || data.requests.length === 0) {
        contactList.innerHTML += `<div style="text-align:center; color:var(--text-muted); padding:20px; font-size:0.85rem;">لا يوجد أصدقاء بعد. اضغط على زر (+) بالأعلى لإضافة أصدقائك!</div>`;
      }
    }

    async function respondRequest(requesterId, action) {
      const userId = userProfile.id || userProfile._id;
      await fetch('/api/friends/respond', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, requesterId, action })
      });
      loadFriendsAndData();
    }

    let activeChatId = null;
    function startChat(friendId, friendName) {
      activeChatId = friendId;
      document.getElementById('current-chat-title').textContent = `محادثة مع: ${friendName}`;
      document.getElementById('messages-container').innerHTML = '';
    }

    function sendMessage() {
      const text = document.getElementById('message-input').value.trim();
      if (!text || !activeChatId) return;
      socket.emit('send_message', { recipientId: activeChatId, text, id: Date.now() });
      document.getElementById('message-input').value = '';
    }

    socket.on('receive_message', (msg) => {
      const container = document.getElementById('messages-container');
      const isMe = msg.senderId === socket.id;
      container.innerHTML += `<div class="message ${isMe ? 'sent' : 'received'}">${msg.text}</div>`;
      container.scrollTop = container.scrollHeight;
    });

    // استقبال إشعار طلب الصداقة اللحظي فوراً بفضل الـ Room
    socket.on('new_friend_request', () => { 
      loadFriendsAndData(); 
    });

    socket.on('friends_updated', () => { 
      loadFriendsAndData();
    });

    loadFriendsAndData();
  </script>
</body>
</html>
