<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NexusChat — Real-Time Messaging</title>
  <link rel="stylesheet" href="style.css" />
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <!-- Auth / Onboarding Modal -->
  <div id="auth-modal" class="modal active">
    <div class="modal-card auth-card">
      <div class="brand-logo">N</div>
      <h2>Welcome to NexusChat</h2>
      <p>Enter a display name to join the real-time network.</p>
      <form id="auth-form">
        <input type="text" id="username-input" placeholder="Your Name (e.g., Alex)" required autocomplete="off" maxlength="24" />
        <button type="submit" class="btn-primary">Start Messaging</button>
      </form>
    </div>
  </div>

  <!-- Main Application Shell -->
  <div id="app-container" class="app-shell">
    <!-- Sidebar: Contacts & Rooms -->
    <aside id="sidebar" class="sidebar">
      <header class="sidebar-header">
        <div class="user-profile">
          <div id="my-avatar" class="avatar">U</div>
          <div class="user-meta">
            <span id="my-username" class="username">User</span>
            <span class="status-text">Online</span>
          </div>
        </div>
        <button id="theme-toggle" class="icon-btn" title="Toggle Dark/Light Theme" aria-label="Toggle Theme">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </header>

      <div class="search-box">
        <input type="text" id="contact-search" placeholder="Search users..." />
      </div>

      <div id="contact-list" class="contact-list">
        <!-- Global Lobby Default Room -->
        <div class="contact-item active" data-id="global">
          <div class="avatar global-avatar">#</div>
          <div class="contact-info">
            <div class="contact-top">
              <span class="contact-name">Global Lobby</span>
              <span class="contact-time">Public</span>
            </div>
            <p class="contact-preview">Broadcast channel for all online users</p>
          </div>
        </div>
        <!-- Dynamic Online Users Injected Here -->
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="chat-area">
      <header class="chat-header">
        <div class="chat-header-left">
          <button id="mobile-back-btn" class="icon-btn mobile-only" aria-label="Back to Contacts">
            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <div id="active-chat-avatar" class="avatar global-avatar">#</div>
          <div class="chat-header-info">
            <h3 id="active-chat-name">Global Lobby</h3>
            <span id="active-chat-status" class="typing-indicator">Everyone online</span>
          </div>
        </div>

        <div id="call-controls" class="chat-header-actions hidden">
          <button id="audio-call-btn" class="icon-btn" title="Voice Call" aria-label="Voice Call">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
          </button>
          <button id="video-call-btn" class="icon-btn" title="Video Call" aria-label="Video Call">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
              <polygon points="23 7 16 12 23 17 23 7"></polygon>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
            </svg>
          </button>
        </div>
      </header>

      <!-- Messages Feed -->
      <section id="messages-container" class="messages-container"></section>

      <!-- File Attachment Preview Banner -->
      <div id="file-preview-bar" class="file-preview-bar hidden">
        <div id="file-preview-content" class="file-preview-content"></div>
        <button id="cancel-file-btn" class="icon-btn" aria-label="Remove Attachment">✕</button>
      </div>

      <!-- Message Composer -->
      <footer class="chat-footer">
        <input type="file" id="file-input" class="hidden" accept="image/*,video/*,.pdf,.doc,.docx,.txt" />
        <button id="attach-btn" class="icon-btn" title="Attach Image, Video, or Document" aria-label="Attach File">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
          </svg>
        </button>
        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" />
        <button id="send-btn" class="send-btn" aria-label="Send Message">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </footer>
    </main>
  </div>

  <!-- WebRTC Voice/Video Call Modal -->
  <div id="call-modal" class="modal">
    <div class="call-container">
      <div class="call-header">
        <h3 id="call-peer-name">Connecting...</h3>
        <span id="call-status-text">Ringing...</span>
      </div>

      <div class="video-grid">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
      </div>

      <!-- Incoming Call Action Prompts -->
      <div id="incoming-call-actions" class="call-actions hidden">
        <button id="accept-call-btn" class="btn-call accept">Accept</button>
        <button id="reject-call-btn" class="btn-call reject">Decline</button>
      </div>

      <!-- Active Call Controls -->
      <div id="active-call-actions" class="call-actions">
        <button id="toggle-mic-btn" class="btn-control" title="Mute/Unmute">Mic On</button>
        <button id="toggle-cam-btn" class="btn-control" title="Camera On/Off">Cam On</button>
        <button id="end-call-btn" class="btn-call reject">End Call</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
