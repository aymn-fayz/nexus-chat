<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusChat - تسجيل الدخول</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0f172a; color: #f8fafc;
    }
    .card {
      background: #1e293b; padding: 2rem; border-radius: 16px; width: 100%; max-width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    h2 { text-align: center; margin-top: 0; color: #38bdf8; }
    input {
      width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px;
      border: 1px solid #334155; background: #0f172a; color: white; font-size: 1rem;
    }
    button {
      width: 100%; padding: 12px; margin-top: 12px; border: none; border-radius: 8px;
      background: #38bdf8; color: #0f172a; font-weight: bold; font-size: 1rem; cursor: pointer;
    }
    button:hover { background: #0284c7; color: white; }
    .toggle {
      text-align: center; margin-top: 16px; font-size: 0.9rem; color: #94a3b8; cursor: pointer;
    }
    .toggle span { color: #38bdf8; text-decoration: underline; }
    #msg { text-align: center; margin-top: 12px; font-size: 0.9rem; color: #f87171; }
  </style>
</head>
<body>

<div class="card">
  <h2 id="form-title">تسجيل الدخول</h2>
  <form id="auth-form">
    <input type="text" id="username" placeholder="اسم المستخدم" style="display: none;">
    <input type="email" id="email" placeholder="البريد الإلكتروني" required>
    <input type="password" id="password" placeholder="كلمة المرور" required>
    <button type="submit" id="submit-btn">دخول</button>
  </form>
  <div id="msg"></div>
  <div class="toggle" id="toggle-mode">ليس لديك حساب؟ <span>أنشئ حساباً جديداً</span></div>
</div>

<script>
  let isLogin = true;
  const form = document.getElementById('auth-form');
  const title = document.getElementById('form-title');
  const usernameInput = document.getElementById('username');
  const submitBtn = document.getElementById('submit-btn');
  const toggleBtn = document.getElementById('toggle-mode');
  const msg = document.getElementById('msg');

  // التبديل بين تسجيل الدخول وإنشاء حساب
  toggleBtn.addEventListener('click', () => {
    isLogin = !isLogin;
    msg.textContent = '';
    if (isLogin) {
      title.textContent = 'تسجيل الدخول';
      usernameInput.style.display = 'none';
      usernameInput.required = false;
      submitBtn.textContent = 'دخول';
      toggleBtn.innerHTML = 'ليس لديك حساب؟ <span>أنشئ حساباً جديداً</span>';
    } else {
      title.textContent = 'إنشاء حساب جديد';
      usernameInput.style.display = 'block';
      usernameInput.required = true;
      submitBtn.textContent = 'تسجيل';
      toggleBtn.innerHTML = 'لديك حساب بالفعل؟ <span>سجّل الدخول</span>';
    }
  });

  // إرسال البيانات للسيرفر
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.style.color = '#38bdf8';
    msg.textContent = 'جاري التحقق...';

    const endpoint = isLogin ? '/api/login' : '/api/register';
    const payload = {
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    };
    if (!isLogin) payload.username = usernameInput.value;

    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (!res.ok) {
        msg.style.color = '#f87171';
        msg.textContent = data.message || 'حدث خطأ ما';
        return;
      }

      if (isLogin) {
        // حفظ بيانات المستخدم والانتقال للدردشة
        localStorage.setItem('nexus_user', JSON.stringify(data.user));
        window.location.href = '/index.html';
      } else {
        // تم إنشاء الحساب بنجاح
        msg.style.color = '#4ade80';
        msg.textContent = 'تم إنشاء الحساب! يمكنك تسجيل الدخول الآن.';
        toggleBtn.click();
      }
    } catch (err) {
      msg.style.color = '#f87171';
      msg.textContent = 'تعذر الاتصال بالسيرفر';
    }
  });
</script>

</body>
</html>
